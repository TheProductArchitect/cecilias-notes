# User Flows — machine-queryable
#
# Companion to USER_FLOWS.md. Same content, structured for grep / jq / LLM queries.
#
# Schema (per flow):
#   id            stable dot-notation id ("editor.pages.add")
#   domain        one of: onboarding, library_nav, library_notebooks,
#                 library_subjects, library_quizzes, library_trash,
#                 library_search, library_ask, editor_open, editor_strokes,
#                 editor_text, editor_media, editor_pdf, editor_audio,
#                 editor_highlights, editor_ai, editor_customise,
#                 editor_export, settings, sync, handoff, widgets,
#                 system_integrations, accessibility, mac_capture
#   name          short label
#   trigger       what starts the flow
#   devices:
#     ipad|iphone|mac:
#       status    implemented|partial|stub|missing|n_a
#       ux        one-line UX note (may be omitted if trivial)
#       reason    only when status == n_a — why this device doesn't offer it
#   steps         ordered array of user-observable steps (iPad canonical)
#   files         key files that implement or should implement the flow
#   notifications names on the NotificationCenter bus that participate
#   priority      only when any device is missing/stub: p0|p1|p2
#
# Query recipes:
#   All Mac gaps:
#     yq '.flows[] | select(.devices.mac.status == "missing" or .devices.mac.status == "stub")' USER_FLOWS.yaml
#   Everything blocked on the notification bus:
#     yq '.flows[] | select(.notifications | length > 0)' USER_FLOWS.yaml
#   All p0 punchlist:
#     yq '.flows[] | select(.priority == "p0")' USER_FLOWS.yaml

version: 1
