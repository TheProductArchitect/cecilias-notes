name: Build

# Fast, no-signing builds of both targets on every PR + push to main.
# Unit tests run on an iPad simulator after the iOS build path is green.
# We do not run signed builds in CI — those need Apple Developer secrets
# and are gated to release workflows in a separate file. The goal here
# is: does the code compile cleanly for iOS and macOS on a stock Xcode?
#
# This workflow is what a contributor's PR trips first. If it fails on
# their branch, they see the same output locally on the next
# `xcodebuild -quiet build`. No environment surprises.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual re-run from the Actions tab, handy after a runner-image bump.
  workflow_dispatch:

concurrency:
  # Cancel in-progress runs for the same PR when a new commit lands —
  # keeps queue times sane without dropping main-branch runs.
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios:
    name: iOS + iPadOS build
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        # Highest Xcode on the image, picked dynamically so runner-image
        # bumps don't silently pin us to an old toolchain. The project
        # targets iOS 26 — anything older can't even load the simulators.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project CeciliasNotes/CeciliasNotes.xcodeproj \
            -scheme CeciliasNotes \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build

  unit-tests:
    name: iOS unit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Boot simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin); devs=[x for xs in d['devices'].values() for x in xs if x.get('isAvailable') and 'iPad' in x.get('name','')]; print(devs[0]['udid'] if devs else '')")
          if [ -z "$DEVICE" ]; then
            echo "::error::No available iPad simulator on runner"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$DEVICE" || true
          echo "SIMULATOR_UDID=$DEVICE" >> "$GITHUB_ENV"

      - name: Run CeciliasNotesTests
        run: |
          xcodebuild \
            -project CeciliasNotes/CeciliasNotes.xcodeproj \
            -scheme CeciliasNotes \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:CeciliasNotesTests \
            test

  mac:
    name: macOS build
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project CeciliasNotes/CeciliasNotes.xcodeproj \
            -scheme CeciliasNotesMac \
            -destination 'generic/platform=macOS' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build

  graph:
    name: Code graph freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate code graph
        # Runs the same lexical scanner contributors run locally. If the
        # committed CODE_GRAPH.md / .json don't match a fresh regen, the
        # PR touched structure without refreshing the map — surface it so
        # the map stays a source of truth, not a stale artifact.
        run: |
          python3 Documentation/tools/build_code_graph.py

      - name: Fail if graph drifted
        run: |
          if ! git diff --quiet Documentation/CODE_GRAPH.md Documentation/CODE_GRAPH.json; then
            echo "::error::Documentation/CODE_GRAPH.md or CODE_GRAPH.json is stale."
            echo "Run: python3 Documentation/tools/build_code_graph.py"
            echo "…then commit the regenerated files."
            git diff --stat Documentation/CODE_GRAPH.md Documentation/CODE_GRAPH.json
            exit 1
          fi
