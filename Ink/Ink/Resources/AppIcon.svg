<?xml version="1.0" encoding="UTF-8"?>
<!--
    Ink — App Icon master SVG.

    The icon concept: an ink drop forming the stem of a lowercase "i".
    The dot of the i is the accent-blue circle above.

    To produce light/dark/tinted variants, change the three fill values:
      Background:  #FAFAF8 (light) / #111110 (dark) / system-background (tinted)
      Foreground:  #1D1D1B (light) / #F5F5F2 (dark) / system-label       (tinted)
      Accent dot:  #007AFF (light) / #0A84FF (dark) / system-tint        (tinted)

    Coordinate space: 100×100 reference grid. Corner radius 22.37 (≈ Apple's
    superellipse approximation for app-icon masking).

    The drawInkForm method in DesignSystem/InkIconRenderer.swift is the
    programmatic equivalent of this SVG. Keep the two synchronised.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">

    <!-- Background -->
    <rect width="100" height="100" rx="22.37" ry="22.37" fill="#FAFAF8"/>

    <!-- Ink-drop body (stem of the i) -->
    <path
        d="M50,78
           C32,65 32,50 32,42
           C32,28 44,24 50,32
           C56,24 68,28 68,42
           C68,50 68,65 50,78Z"
        fill="#1D1D1B"
    />

    <!-- Accent dot (the dot of the i) -->
    <circle cx="50" cy="20" r="7" fill="#007AFF"/>

</svg>
